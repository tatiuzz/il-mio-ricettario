<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il mio Ricettario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #faf6f0;
    --paper: #fffdfa;
    --ink: #2b241e;
    --ink-soft: #6f6255;
    --accent: #b5502a;
    --accent-soft: #f4e3d6;
    --border: #e9ddcd;
    --macro-bg: #eef6f0;
    --macro-border: #cfe8d6;
    --fredda-bg: #e3f0f8;
    --fredda-ink: #276186;
    --dieta-bg: #f1ece0;
    --dieta-ink: #7a6a3f;
    --star: #c99a1e;
    --shadow: 0 3px 14px rgba(43,36,24,0.08);
    --font-display: "Playfair Display", Georgia, "Iowan Old Style", serif;
    --font-body: "Work Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  html{ font-size:14px; scroll-behavior:smooth; }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family: var(--font-body);
    background:var(--bg);
    color:var(--ink);
    font-size:15px;
    line-height:1.55;
    padding-bottom:60px;
  }
  h1,h2,h3{ font-family: var(--font-display); font-weight:700; }
  a{ color:var(--accent); }
  button{ font-family: var(--font-body); }

  /* ---------- banner modifiche non esportate ---------- */
  #banner-dirty{
    display:none;
    align-items:center;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    background:#3d3128;
    color:#f6ede1;
    padding:10px 16px;
    font-size:0.85rem;
    text-align:center;
  }
  #banner-dirty .btn-export{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:6px 14px;
    border-radius:999px;
    cursor:pointer;
    font-weight:600;
  }
  #banner-dirty .btn-dismiss-banner{
    background:transparent;
    border:1px solid #8a7d6d;
    color:#f6ede1;
    padding:5px 10px;
    border-radius:999px;
    cursor:pointer;
    font-size:0.78rem;
  }

  #app{ max-width: 900px; margin: 0 auto; padding: 0 16px; }

  /* ---------- copertina ---------- */
  .copertina{
    min-height: 82vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:8px;
    padding: 40px 16px;
  }
  .copertina-ornamento{ font-size:1.9rem; color:var(--accent); margin-bottom:6px; }
  .copertina-titolo{ font-size:2.5rem; margin:0; letter-spacing:0.01em; }
  .copertina-firma{ margin:2px 0 0; font-size:0.95rem; color:var(--ink-soft); }
  .copertina-firma strong{ color:var(--ink); font-weight:700; }
  .copertina-sottotitolo{ font-style:italic; color:var(--ink-soft); margin:6px 0 0; font-size:1rem; }
  .copertina-info{ color:var(--ink-soft); font-size:0.88rem; margin:14px 0 0; }
  .copertina-aggiornato{ color:var(--ink-soft); font-size:0.78rem; margin:2px 0 20px; }
  .btn-sfoglia{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:13px 28px;
    border-radius:999px;
    font-size:1rem;
    cursor:pointer;
    box-shadow: var(--shadow);
  }
  .copertina-azioni-secondarie{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  .btn-secondario{
    background:none; border:1px solid var(--border); color:var(--ink-soft);
    padding:8px 16px; border-radius:999px; cursor:pointer; font-size:0.82rem;
  }
  .btn-secondario:hover{ border-color:var(--accent); color:var(--accent); }
  .copertina-esci{ margin-top:22px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .btn-esci{
    background:none;
    border:1px solid var(--border);
    color:var(--ink-soft);
    padding:8px 20px;
    border-radius:999px;
    cursor:pointer;
    font-size:0.82rem;
  }
  .btn-esci:hover{ border-color:var(--accent); color:var(--accent); }
  #esci-hint{
    display:none;
    font-size:0.76rem;
    color:var(--ink-soft);
    max-width:280px;
    margin:0;
  }

  /* ---------- indice ---------- */
  .back-link{
    display:flex;
    align-items:center;
    gap:6px;
    width:fit-content;
    margin:10px auto 18px;
    background:var(--paper);
    border:1px solid var(--border);
    color:var(--ink);
    font-weight:700;
    font-size:1.15rem;
    padding:13px 28px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .back-link:hover{ border-color:var(--accent); color:var(--accent); }
  .titolo-pagina{ margin:4px 0 14px; font-size:1.6rem; }
  .tab-indici{ display:flex; gap:8px; margin-bottom:14px; }
  .tab-indici button{
    flex:1; padding:9px; border-radius:10px; border:1px solid var(--border);
    background:var(--paper); cursor:pointer; font-size:0.85rem; font-weight:600; color:var(--ink-soft);
  }
  .tab-indici button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .chip-gruppo-attivo{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--accent-soft);
    color:var(--accent);
    padding:6px 14px;
    border-radius:999px;
    font-size:0.85rem;
    margin-bottom:14px;
    font-weight:600;
  }
  .chip-x{ cursor:pointer; font-weight:700; }
  #search-box{
    width:100%;
    padding:12px 15px;
    font-size:0.95rem;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--paper);
    margin-bottom:12px;
    font-family: var(--font-body);
  }
  #search-box:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .filtro-speciali{ margin-bottom:14px; }
  .filtro-tags{ display:flex; flex-wrap:wrap; gap:7px; }
  .filtro-tag{
    border:1px solid var(--border);
    background:var(--paper);
    color:var(--ink);
    padding:6px 13px;
    border-radius:999px;
    font-size:0.82rem;
    cursor:pointer;
  }
  .filtro-tag.active{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }

  details.filtro-riga{ margin-bottom:10px; padding-top:9px; border-top:1px solid var(--border); }
  details.filtro-riga summary{
    cursor:pointer;
    font-size:0.72rem;
    letter-spacing:0.09em;
    color:var(--ink-soft);
    font-weight:700;
    padding:3px 0 8px;
    list-style:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  details.filtro-riga summary::-webkit-details-marker{ display:none; }
  details.filtro-riga summary::after{
    content:'▾';
    font-size:0.85rem;
    color:var(--ink-soft);
    transition: transform 0.15s ease;
  }
  details.filtro-riga[open] summary::after{ transform: rotate(180deg); }

  #risultati-indice{ margin-top:16px; }
  .capitolo-titolo{
    font-size:1.25rem;
    margin:24px 0 2px;
    color:var(--accent);
  }
  .capitolo-divider{ height:1px; background:var(--border); margin-bottom:12px; }
  .voce-indice{
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:12px;
    padding:13px 15px;
    margin-bottom:10px;
    cursor:pointer;
    transition: box-shadow 0.15s ease, transform 0.1s ease;
  }
  .voce-indice:hover{ box-shadow: var(--shadow); transform: translateY(-1px); }
  .voce-indice-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .voce-titolo{ font-family: var(--font-display); font-size:1.05rem; font-weight:700; }
  .voce-numero{ color:var(--ink-soft); font-weight:400; font-size:0.85em; margin-right:4px; }
  .no-results{ text-align:center; color:var(--ink-soft); padding:30px 16px; }

  /* ---------- tag generici ---------- */
  .tags{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; }
  .tag{
    font-size:0.76rem;
    padding:4px 10px;
    border-radius:999px;
    font-weight:600;
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .tag.categoria{ background:var(--accent-soft); color:var(--accent); }
  .tag.difficolta-Facile{ background:#e4f3e0; color:#3f7a30; }
  .tag.difficolta-Media{ background:#fbeecb; color:#8a6414; }
  .tag.difficolta-Difficile{ background:#f6dede; color:#a13939; }
  .tag.tag-difficolta-editabile{ cursor:pointer; }
  .tag.tag-difficolta-editabile:hover{ filter:brightness(0.95); }
  .tag.tempo{ background:#e6eef6; color:#31577a; }
  .tag.fredda{ background:var(--fredda-bg); color:var(--fredda-ink); }
  .tag.dieta{ background:var(--dieta-bg); color:var(--dieta-ink); }
  .tag.gruppo{ background:#efe6f6; color:#6c3fa1; cursor:pointer; }
  .tag.gruppo:hover{ filter:brightness(0.96); }
  .tag.manuale{ background:#f0f0ec; color:#55503f; }
  .tag-remove{ cursor:pointer; font-weight:700; opacity:0.6; }
  .tag-remove:hover{ opacity:1; }
  .btn-add-tag{
    border:1px dashed var(--border);
    background:none;
    color:var(--ink-soft);
    padding:4px 10px;
    border-radius:999px;
    font-size:0.76rem;
    cursor:pointer;
  }
  .tag-input{
    font-size:0.76rem;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid var(--accent);
  }

  .btn-preferito{
    background:none;
    border:none;
    font-size:1.25rem;
    line-height:1;
    cursor:pointer;
    color:var(--border);
    flex-shrink:0;
    padding:0 2px;
  }
  .btn-preferito.attivo{ color:var(--star); }
  .btn-preferito-grande{ font-size:1.6rem; }

  /* ---------- pagina ricetta ---------- */
  .pagina-ricetta{
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow: var(--shadow);
    padding:24px 22px 28px;
    margin-bottom:30px;
  }
  .ricetta-titolo-riga{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .ricetta-titolo{ font-size:1.6rem; margin:6px 0 4px; line-height:1.25; }
  .titolo-originale{ font-style:italic; color:var(--ink-soft); font-size:0.85rem; margin:-2px 0 8px; }
  .autore{ color:var(--ink-soft); font-size:0.85rem; margin-bottom:10px; }
  .pagina-ricetta .tags{ margin-bottom:16px; }

  .porzioni-box{
    display:flex; align-items:center; gap:12px;
    background:var(--bg); border:1px solid var(--border);
    border-radius:12px; padding:8px 14px; width:fit-content; margin-bottom:16px;
  }
  .porzioni-box .label{ font-size:0.85rem; color:var(--ink-soft); }
  .stepper{ display:flex; align-items:center; gap:10px; }
  .stepper-btn{
    width:32px; height:32px; border-radius:50%;
    border:1px solid var(--accent); background:#fff; color:var(--accent);
    font-size:1.1rem; line-height:1; cursor:pointer;
  }
  .stepper .valore{ font-weight:700; font-size:1rem; min-width:20px; text-align:center; }

  .macro-box{
    background:var(--macro-bg); border:1px solid var(--macro-border);
    border-radius:14px; padding:12px 14px; font-size:0.86rem; margin-bottom:16px;
  }
  .macro-box .macro-title{ font-weight:700; margin-bottom:6px; color:#2c5a3a; }
  .macro-badge-stimato{
    display:inline-block; margin-left:6px; font-size:0.68rem; font-weight:600;
    text-transform:uppercase; letter-spacing:0.03em; background:#fff3cd; color:#8a6d1d;
    border:1px solid #e8d38a; border-radius:999px; padding:1px 8px; vertical-align:middle;
  }
  .macro-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:4px 14px; }

  .sezione{ margin-top:20px; }
  .section-title{
    margin:0 0 8px; font-size:0.92rem; text-transform:uppercase;
    letter-spacing:0.05em; color:var(--ink-soft); font-family: var(--font-body); font-weight:700;
  }
  ul.ingredienti{ list-style:none; margin:0; padding:0; }
  ul.ingredienti li{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:7px 0; border-bottom:1px dashed var(--border);
    font-size:0.92rem;
  }
  .ingrediente-vuoto{ color:var(--ink-soft); font-style:italic; }
  .ingrediente-remove{
    border:none; background:none; color:var(--ink-soft); opacity:0.4;
    cursor:pointer; font-size:0.8rem; flex-shrink:0;
  }
  .ingrediente-remove:hover{ opacity:1; color:#a13939; }
  .btn-add-ingrediente{
    margin-top:10px; border:1px dashed var(--border); background:none;
    color:var(--ink-soft); padding:7px 14px; border-radius:10px; cursor:pointer; font-size:0.82rem;
  }
  ol.passi{ margin:0; padding-left:20px; font-size:0.92rem; }
  ol.passi li{ margin-bottom:8px; }
  .nota-box{ white-space:pre-line; font-size:0.88rem; }
  .nota-box.nota-vuota{ color:var(--ink-soft); font-style:italic; }
  .meta-riga{ color:var(--ink-soft); font-size:0.78rem; margin:2px 0 12px; }

  /* affordance elementi modificabili */
  .editable{ cursor:text; border-bottom:1px dashed transparent; border-radius:3px; }
  .editable:hover{ border-bottom-color: var(--accent); background: rgba(181,80,42,0.05); }
  .edit-field{
    font-family: inherit; font-size:inherit; width:100%;
    border:1px solid var(--accent); border-radius:8px; padding:6px 8px;
    background:#fff; color:var(--ink);
  }
  .edit-field-multiline{ resize:vertical; }

  .nav-pagine{
    display:flex; justify-content:space-between; gap:10px;
    margin-top:28px; padding-top:16px; border-top:1px solid var(--border);
  }
  .nav-pagine button{
    background:none; border:none; color:var(--accent);
    cursor:pointer; font-size:0.85rem; max-width:45%; text-align:left;
  }
  .nav-next{ text-align:right !important; }

  @media (min-width:720px){
    .ricetta-titolo{ font-size:1.9rem; }
  }

  /* ---------- stampa / esportazione PDF ---------- */
  #print-area{ display:none; }
  @media print{
    body{ background:#fff; padding-bottom:0; }
    #banner-dirty, #app{ display:none !important; }
    #print-area{ display:block !important; max-width:none; margin:0; padding:0; color:#1a1512; }
    #print-area .stampa-copertina{ text-align:center; margin-bottom:26px; page-break-after:always; }
    #print-area .stampa-copertina h1{ font-family: var(--font-display); font-size:2rem; margin:0 0 6px; }
    #print-area .stampa-capitolo{
      font-family: var(--font-display); font-size:1.3rem; color:#000;
      margin:0 0 12px; page-break-before:always; break-before:page;
    }
    #print-area .stampa-capitolo.prima{ page-break-before:auto; break-before:auto; }
    #print-area article.stampa-ricetta{
      margin-bottom:22px; padding-bottom:14px; border-bottom:1px solid #ccc;
      break-inside:avoid-page;
    }
    #print-area article.stampa-ricetta h2{ font-size:1.1rem; margin:0 0 2px; }
    #print-area .stampa-originale{ font-style:italic; color:#555; margin:0 0 6px; font-size:0.85rem; }
    #print-area .stampa-meta{ font-size:0.78rem; color:#555; margin-bottom:6px; }
    #print-area .stampa-macro{ font-size:0.78rem; margin-bottom:8px; color:#2c5a3a; }
    #print-area h4{
      margin:10px 0 4px; font-size:0.8rem; text-transform:uppercase;
      letter-spacing:0.04em; color:#555; font-family: var(--font-body);
    }
    #print-area ul, #print-area ol{ margin:0 0 8px; padding-left:18px; font-size:0.85rem; }
    #print-area li{ margin-bottom:3px; }
    #print-area .stampa-note{ font-size:0.8rem; font-style:italic; margin-top:6px; }
  }

  /* ---------- indice: pagina di atterraggio ---------- */
  .indice-titolo-grande{
    text-align:center;
    font-size:2.1rem;
    margin:6px 0 20px;
  }
  .gruppi-bar-wrap{ margin-bottom:18px; }
  .gruppi-bar-label{
    font-size:0.72rem; letter-spacing:0.09em; color:var(--ink-soft);
    font-weight:700; margin-bottom:8px;
  }
  .gruppi-bar{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:8px;
    -webkit-overflow-scrolling:touch; scrollbar-width:thin;
  }
  .gruppi-bar::-webkit-scrollbar{ height:5px; }
  .gruppi-bar::-webkit-scrollbar-thumb{ background:var(--border); border-radius:999px; }
  .chip-gruppo-bar{
    flex-shrink:0; white-space:nowrap;
    background:#efe6f6; color:#6c3fa1; border:1px solid #e0d2ef;
    padding:7px 15px; border-radius:999px; font-size:0.8rem; cursor:pointer;
  }
  .chip-gruppo-bar:hover{ filter:brightness(0.96); }

  .btn-tutte{
    display:block; width:100%; background:var(--accent); color:#fff; border:none;
    border-radius:14px; padding:15px; font-size:1.02rem; font-weight:600;
    cursor:pointer; margin-bottom:22px; box-shadow:var(--shadow);
  }
  .btn-tutte-conteggio{ font-weight:400; opacity:0.85; font-size:0.9em; }

  .griglia-portate{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));
    gap:10px; margin-bottom:10px;
  }
  .portata-card{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:5px; background:var(--paper); border:1px solid var(--border);
    border-radius:16px; cursor:pointer; padding:8px; text-align:center;
    transition:box-shadow 0.15s ease, transform 0.1s ease;
  }
  .portata-card:hover{ box-shadow:var(--shadow); transform:translateY(-2px); border-color:var(--accent); }
  .portata-card .emoji{ font-size:1.6rem; line-height:1; }
  .portata-card .nome{ font-size:0.74rem; font-weight:600; line-height:1.2; }
  .portata-card .conteggio{ font-size:0.68rem; color:var(--ink-soft); }

  /* ---------- filtro portata sempre aperto ---------- */
  .filtro-riga-fissa{ margin-bottom:10px; padding-top:9px; border-top:1px solid var(--border); }
  .filtro-riga-titolo{
    font-size:0.72rem; letter-spacing:0.09em; color:var(--ink-soft);
    font-weight:700; padding:3px 0 8px;
  }

  /* ---------- ordinamento ---------- */
  .sort-select{
    width:100%; padding:11px 14px; font-size:0.88rem; border-radius:12px;
    border:1px solid var(--border); background:var(--paper); margin-bottom:10px;
    font-family:var(--font-body); color:var(--ink); cursor:pointer;
  }
  .sort-select:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .conteggio-risultati{ color:var(--ink-soft); font-size:0.8rem; margin:0 0 10px; }

  /* ---------- navigazione tra portate ---------- */
  .nav-portate-frecce{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin:4px 0 14px;
  }
  .titolo-portata-corrente{ flex:1; text-align:center; font-size:1.35rem; margin:0; }
  .freccia-portata{
    flex-shrink:0; width:38px; height:38px; border-radius:50%;
    border:1px solid var(--border); background:var(--paper); color:var(--accent);
    font-size:1.1rem; cursor:pointer;
  }
  .freccia-portata:hover{ border-color:var(--accent); background:var(--accent-soft); }

  .tag.tag-pn{ background:#fde7d8; color:#a15a1f; }

  /* ---------- ordinamento a tasti ---------- */
  .sort-bar{ display:flex; gap:8px; margin-bottom:12px; }
  .sort-btn{
    flex:1; padding:9px; border-radius:10px; border:1px solid var(--border);
    background:var(--paper); cursor:pointer; font-size:0.85rem; font-weight:600; color:var(--ink-soft);
  }
  .sort-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent); }

  /* ---------- pulsante "torna su" ---------- */
  #scroll-top-btn{
    display:none; position:fixed; right:18px; bottom:22px; z-index:40;
    width:46px; height:46px; border-radius:50%; border:none;
    background:var(--accent); color:#fff; font-size:1.2rem; cursor:pointer;
    box-shadow:0 4px 14px rgba(43,36,24,0.25);
    align-items:center; justify-content:center;
  }
  #scroll-top-btn:hover{ filter:brightness(1.08); }

  /* ---------- ricette correlate ---------- */
  .correlate-lista{ display:flex; flex-direction:column; gap:8px; }
  .correlata-card{
    display:flex; align-items:center; gap:10px; text-align:left;
    background:var(--bg); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; cursor:pointer; font-family:var(--font-body); font-size:0.88rem;
  }
  .correlata-card:hover{ border-color:var(--accent); }
  .correlata-numero{ color:var(--ink-soft); font-size:0.82em; flex-shrink:0; }
  .correlata-titolo{ font-weight:600; }
</style>
</head>

<script>
(function(){
  "use strict";

  const CATEGORIE_ORDINE = ["Antipasto","Primo","Piatto Unico","Secondo","Contorno","Zuppa","Snack","Aperitivo","Frullati","Dolce","Frutta","Condimenti e Salse","Basi e Preparazioni","Altro"];
  const CATEGORIE_EMOJI = {
    "Antipasto":"🥗","Primo":"🍝","Piatto Unico":"🍲","Secondo":"🍖","Contorno":"🥕",
    "Zuppa":"🍜","Snack":"🍪","Aperitivo":"🍹","Frullati":"🥤","Dolce":"🍰","Frutta":"🍓",
    "Condimenti e Salse":"🫙","Basi e Preparazioni":"📋","Altro":"✦"
  };
  const DIFFICOLTA_OPZIONI = ["Facile","Media","Difficile"];
  const DURATA_BUCKETS_ORDINE = ["≤15 min","16-30 min","31-60 min",">60 min"];
  const DIETA_OPZIONI = ["Vegano","Vegetariano","Carne","Pesce"];
  const SORT_NEUTRO = "default";

  const RICETTE_BASE = JSON.parse(document.getElementById('ricette-data').textContent);
  const app = document.getElementById('app');

  let overrides = {};
  let porzioniCorrenti = {};
  const filtri = { search: "", portata: new Set(), durata: new Set(), difficolta: new Set(), dieta: new Set(), prep: new Set(), speciali: new Set(), gruppo: null };

  // ---- memoria di scorrimento / navigazione "indietro" ----
  let scrollMemory = {};
  let pendingBack = false;
  function navigate(newHash){
    scrollMemory[location.hash || '#/'] = window.scrollY;
    location.hash = newHash;
  }
  function goBack(fallbackHash){
    scrollMemory[location.hash || '#/'] = 0;
    if(history.length > 1){
      pendingBack = true;
      history.back();
    } else {
      location.hash = fallbackHash || '#/indice';
    }
  }

  function caricaOverrides(){
    try{ overrides = JSON.parse(localStorage.getItem('ricettario_overrides') || '{}'); }
    catch(e){ overrides = {}; }
  }

  function getRicette(){
    return RICETTE_BASE.map(r => Object.assign({}, r, overrides[r.id] || {}));
  }
  function getRicettaById(id){
    return getRicette().find(r => r.id === id);
  }

  function salvaCampo(id, campo, valore){
    if(!overrides[id]) overrides[id] = {};
    overrides[id][campo] = valore;
    persistOverrides();
  }
  function persistOverrides(){
    localStorage.setItem('ricettario_overrides', JSON.stringify(overrides));
    localStorage.setItem('ricettario_dirty', '1');
    sessionStorage.removeItem('banner_dismissed');
    aggiornaBanner();
  }
  function aggiornaBanner(){
    const dirty = localStorage.getItem('ricettario_dirty') === '1' && sessionStorage.getItem('banner_dismissed') !== '1';
    document.getElementById('banner-dirty').style.display = dirty ? 'flex' : 'none';
  }
  function dismissBanner(){
    sessionStorage.setItem('banner_dismissed', '1');
    aggiornaBanner();
  }
  function esportaRicettario(){
    const clone = document.documentElement.cloneNode(true);
    const merged = getRicette();
    clone.querySelector('#ricette-data').textContent = JSON.stringify(merged, null, 2);
    const htmlStr = '<!DOCTYPE html>\n' + clone.outerHTML;
    const blob = new Blob([htmlStr], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'Ricettario.html';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    localStorage.setItem('ricettario_dirty', '0');
    aggiornaBanner();
  }

  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function formattaData(iso){
    if(!iso) return '';
    const parti = String(iso).split('-');
    if(parti.length !== 3) return iso;
    const [y,m,d] = parti;
    return `${d}/${m}/${y}`;
  }
  function ultimoAggiornamento(){
    const date = RICETTE_BASE.map(r => r.dataAggiunta).filter(Boolean).sort();
    if(!date.length) return null;
    return formattaData(date[date.length - 1]);
  }

  function costruisciHtmlStampaRicetta(r){
    const m = r.macronutrienti;
    const metaParti = [
      `di @${escapeHtml(r.autore)}`,
      (r.categorie || []).join(', '),
      escapeHtml(r.difficolta),
      `⏱ ${escapeHtml(r.tempo || '—')}`
    ];
    if(r.persone) metaParti.push(`${r.persone} porzioni`);
    if(r.fredda) metaParti.push('❄️ Fredda');
    const ingredientiHtml = (r.ingredienti || []).map(ing =>
      `<li>${escapeHtml(formatIngredienteScalato(ing, 1).trim())}</li>`
    ).join('');
    const passiHtml = (r.svolgimento || '').split('\n').filter(l => l.trim() !== '').map(l =>
      `<li>${escapeHtml(l.replace(/^\d+\.\s*/, ''))}</li>`
    ).join('');
    return `
      <article class="stampa-ricetta">
        <h2>#${r.numero ?? ''} ${escapeHtml(r.titolo)}</h2>
        ${r.titoloOriginale ? `<div class="stampa-originale">${escapeHtml(r.titoloOriginale)}</div>` : ''}
        <div class="stampa-meta">${metaParti.filter(Boolean).join(' · ')}</div>
        ${m ? `<div class="stampa-macro">Valori nutrizionali per porzione${r.macroStimato ? ' (stimati)' : ''}: ${escapeHtml(m.kcal)} kcal · Proteine ${escapeHtml(m.proteine)} g · Carboidrati ${escapeHtml(m.carboidrati)} g · Grassi ${escapeHtml(m.grassi)} g</div>` : ''}
        <h4>Ingredienti</h4>
        <ul>${ingredientiHtml}</ul>
        <h4>Preparazione</h4>
        <ol>${passiHtml}</ol>
        ${r.note ? `<div class="stampa-note">Note: ${escapeHtml(r.note)}</div>` : ''}
      </article>
    `;
  }

  function apriStampaRicettario(){
    const tutte = getRicette();
    const aggiornato = ultimoAggiornamento();
    let html = `
      <div class="stampa-copertina">
        <h1>Il mio Ricettario</h1>
        <p><strong>by tatiuzz</strong></p>
        <p>${tutte.length} ricette${aggiornato ? ` · aggiornato il ${aggiornato}` : ''}</p>
      </div>
    `;
    let primo = true;
    CATEGORIE_ORDINE.forEach(cat => {
      const delCap = tutte.filter(r => (r.categorie || []).includes(cat));
      if(delCap.length === 0) return;
      html += `<h2 class="stampa-capitolo${primo ? ' prima' : ''}">${escapeHtml(cat)}</h2>`;
      html += delCap.map(costruisciHtmlStampaRicetta).join('');
      primo = false;
    });
    document.getElementById('print-area').innerHTML = html;
    window.print();
  }

  function bucketDurata(tempoStr){
    const nums = (String(tempoStr).match(/\d+/g) || []).map(Number);
    if(nums.length === 0) return "n/d";
    let max = Math.max(...nums);
    if(/ora|ore/i.test(tempoStr)) max = max * 60;
    if(max <= 15) return "≤15 min";
    if(max <= 30) return "16-30 min";
    if(max <= 60) return "31-60 min";
    return ">60 min";
  }

  function matchesFiltriBase(r){
    const categorie = r.categorie || [];
    const dieta = r.dieta || [];
    const tags = r.tags || [];
    if(filtri.gruppo && r.gruppo !== filtri.gruppo) return false;
    if(filtri.difficolta.size && !filtri.difficolta.has(r.difficolta)) return false;
    if(filtri.durata.size && !filtri.durata.has(bucketDurata(r.tempo))) return false;
    if(filtri.dieta.size && !dieta.some(d => filtri.dieta.has(d))) return false;
    if(filtri.prep.has('Fredda') && !r.fredda) return false;
    if(filtri.speciali.has('preferiti') && !r.preferito) return false;
    if(filtri.speciali.has('PN') && !tags.includes('PN')) return false;
    if(filtri.speciali.has('daProvare') && tags.includes('PN')) return false;
    if(filtri.search){
      const s = filtri.search.toLowerCase();
      const haystack = [
        r.titolo, r.autore, ...categorie, r.tempo, r.gruppo || "",
        String(r.numero ?? ''), '#' + (r.numero ?? ''),
        ...dieta, ...tags, ...r.ingredienti.map(i => i.nome)
      ].join(" ").toLowerCase();
      if(!haystack.includes(s)) return false;
    }
    return true;
  }
  function matchesFiltri(r){
    const categorie = r.categorie || [];
    if(filtri.portata.size && !categorie.some(c => filtri.portata.has(c))) return false;
    return matchesFiltriBase(r);
  }

  function ordinaRicette(lista, sort){
    const arr = [...lista];
    switch(sort){
      case 'recenti-asc':
        arr.sort((a, b) => (a.dataAggiunta || '').localeCompare(b.dataAggiunta || '') || (a.numero || 0) - (b.numero || 0));
        break;
      case 'numero-asc':
        arr.sort((a, b) => (a.numero || 0) - (b.numero || 0));
        break;
      case 'numero-desc':
        arr.sort((a, b) => (b.numero || 0) - (a.numero || 0));
        break;
      case 'recenti-desc':
      case SORT_NEUTRO:
      default:
        arr.sort((a, b) => (b.dataAggiunta || '').localeCompare(a.dataAggiunta || '') || (b.numero || 0) - (a.numero || 0));
    }
    return arr;
  }

  function cicloSort(sortCorrente, campo){
    const attivo = sortCorrente && sortCorrente.startsWith(campo);
    if(!attivo) return campo + '-desc';
    if(sortCorrente === campo + '-desc') return campo + '-asc';
    return SORT_NEUTRO;
  }

  function formatIngredienteScalato(ing, fattore){
    if(ing.quantita === null || ing.quantita === undefined || ing.quantita === ''){
      const unitLabel = ing.unita ? ing.unita + ' ' : '';
      return `${unitLabel}${ing.nome}`.trim();
    }
    const scaled = Math.round(ing.quantita * fattore * 10) / 10;
    const scaledStr = (scaled % 1 === 0) ? String(Math.round(scaled)) : String(scaled).replace('.', ',');
    return `${scaledStr} ${ing.unita} ${ing.nome}`.trim();
  }
  function formatIngredienteRaw(ing){
    if(ing.quantita === null || ing.quantita === undefined || ing.quantita === ''){
      return `${ing.unita || ''} ${ing.nome || ''}`.trim();
    }
    const qStr = (ing.quantita % 1 === 0) ? String(ing.quantita) : String(ing.quantita).replace('.', ',');
    return `${qStr} ${ing.unita} ${ing.nome}`.trim();
  }
  function parseIngredienteRaw(str){
    str = (str || '').trim();
    if(str === '') return { quantita: null, unita: '', nome: '' };
    let m = str.match(/^(q\.?b\.?)\s+(.*)$/i);
    if(m) return { quantita: null, unita: 'q.b.', nome: m[2] };
    m = str.match(/^([\d.,]+)\s+(\S+)\s+(.*)$/);
    if(m){
      const q = parseFloat(m[1].replace(',', '.'));
      return { quantita: isNaN(q) ? null : q, unita: m[2], nome: m[3] };
    }
    return { quantita: null, unita: '', nome: str };
  }

  function aggiungiIngrediente(id){
    const r = getRicettaById(id);
    salvaCampo(id, 'ingredienti', [...r.ingredienti, { quantita: null, unita: '', nome: '' }]);
    render();
  }
  function rimuoviIngrediente(id, idx){
    const r = getRicettaById(id);
    salvaCampo(id, 'ingredienti', r.ingredienti.filter((_, i) => i !== idx));
    render();
  }
  function modificaIngrediente(id, idx, testo){
    const r = getRicettaById(id);
    const parsed = parseIngredienteRaw(testo);
    salvaCampo(id, 'ingredienti', r.ingredienti.map((ing, i) => i === idx ? parsed : ing));
  }
  function aggiungiTag(id, tag){
    const r = getRicettaById(id);
    const tags = [...(r.tags || [])];
    if(!tags.includes(tag)) tags.push(tag);
    salvaCampo(id, 'tags', tags);
  }
  function rimuoviTag(id, tag){
    const r = getRicettaById(id);
    salvaCampo(id, 'tags', (r.tags || []).filter(t => t !== tag));
    render();
  }
  function cambiaDifficolta(id){
    const r = getRicettaById(id);
    const idx = DIFFICOLTA_OPZIONI.indexOf(r.difficolta);
    const next = DIFFICOLTA_OPZIONI[(idx + 1) % DIFFICOLTA_OPZIONI.length];
    salvaCampo(id, 'difficolta', next);
    render();
  }
  function cambiaPorzioni(id, delta){
    const r = getRicettaById(id);
    const attuale = porzioniCorrenti[id] ?? r.persone;
    porzioniCorrenti[id] = Math.max(1, attuale + delta);
    render();
  }
  function toggleFavorito(id){
    const r = getRicettaById(id);
    salvaCampo(id, 'preferito', !r.preferito);
  }

  function avviaModifica(el, valoreAttuale, multiline, onCommit){
    const input = document.createElement(multiline ? 'textarea' : 'input');
    input.value = valoreAttuale;
    input.className = 'edit-field' + (multiline ? ' edit-field-multiline' : '');
    if(multiline) input.rows = Math.max(3, valoreAttuale.split('\n').length + 1);
    el.replaceWith(input);
    input.focus();
    if(input.select) input.select();
    let done = false;
    const commit = () => { if(done) return; done = true; onCommit(input.value); render(); };
    const cancel = () => { if(done) return; done = true; render(); };
    input.addEventListener('keydown', e => {
      if(e.key === 'Enter' && !(multiline && e.shiftKey)){ e.preventDefault(); commit(); }
      else if(e.key === 'Escape'){ e.preventDefault(); cancel(); }
    });
    input.addEventListener('blur', commit);
  }

  function mostraInputTag(btn){
    const id = btn.dataset.id;
    const input = document.createElement('input');
    input.type = 'text'; input.className = 'edit-field tag-input'; input.placeholder = 'nuovo tag';
    btn.replaceWith(input);
    input.focus();
    let done = false;
    const commit = () => {
      if(done) return; done = true;
      const v = input.value.trim();
      if(v) aggiungiTag(id, v);
      render();
    };
    input.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); commit(); }
      else if(e.key === 'Escape'){ e.preventDefault(); done = true; render(); }
    });
    input.addEventListener('blur', commit);
  }

  // ---------------- ROUTING / RENDER ----------------
  function parseHash(){
    const hash = location.hash || '#/';
    if(hash === '#/' || hash === '') return { page: 'copertina' };
    if(hash === '#/indice') return { page: 'indice' };
    if(hash === '#/recenti') return { page: 'redirect', to: '#/indice/tutte/recenti-desc' };
    if(hash.startsWith('#/indice/tutte')){
      const parti = hash.split('/');
      return { page: 'tutte', sort: decodeURIComponent(parti[3] || SORT_NEUTRO) };
    }
    if(hash.startsWith('#/indice/portata/')){
      const resto = hash.replace('#/indice/portata/', '');
      const parti = resto.split('/');
      return { page: 'portata', categoria: decodeURIComponent(parti[0] || ''), sort: decodeURIComponent(parti[1] || SORT_NEUTRO) };
    }
    if(hash.startsWith('#/ricetta/')) return { page: 'ricetta', id: decodeURIComponent(hash.replace('#/ricetta/', '')) };
    return { page: 'copertina' };
  }

  function render(){
    const hash = location.hash || '#/';
    const route = parseHash();
    if(route.page === 'redirect'){ location.hash = route.to; return; }
    if(route.page === 'copertina') renderCopertina();
    else if(route.page === 'indice') renderIndiceLanding();
    else if(route.page === 'tutte') renderListaTutte(route.sort);
    else if(route.page === 'portata') renderListaPortata(route.categoria, route.sort);
    else if(route.page === 'ricetta') renderRicetta(route.id);
    else renderCopertina();

    if(pendingBack){
      pendingBack = false;
      const y = scrollMemory[hash] || 0;
      requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, y)));
    } else {
      window.scrollTo(0, 0);
    }
    aggiornaBottoneScrollTop();
  }

  function refreshView(){
    const route = parseHash();
    if(route.page === 'ricetta') renderRicetta(route.id);
    else if(route.page === 'tutte' && document.getElementById('risultati-indice')) renderRisultatiTutte(route.sort);
    else if(route.page === 'portata' && document.getElementById('risultati-indice')) renderRisultatiPortata(route.categoria, route.sort);
    else render();
  }

  function tentaUscita(){
    window.close();
    setTimeout(() => {
      if(!window.closed){
        const hint = document.getElementById('esci-hint');
        if(hint) hint.style.display = 'block';
      }
    }, 250);
  }

  function renderCopertina(){
    const tot = RICETTE_BASE.length;
    const aggiornato = ultimoAggiornamento();
    app.innerHTML = `
      <div class="copertina">
        <div class="copertina-ornamento">❦</div>
        <h1 class="copertina-titolo">Il mio Ricettario</h1>
        <p class="copertina-firma"><strong>by tatiuzz</strong></p>
        <p class="copertina-sottotitolo">Ricette raccolte, una pagina alla volta</p>
        <p class="copertina-info">${tot} ricette</p>
        ${aggiornato ? `<p class="copertina-aggiornato">Aggiornato il ${aggiornato}</p>` : ''}
        <button class="btn-sfoglia" data-action="go-indice">Sfoglia il ricettario →</button>
        <div class="copertina-azioni-secondarie">
          <button class="btn-secondario" data-action="go-recenti">🕓 Ultime aggiunte</button>
          <button class="btn-secondario" data-action="stampa-pdf">📄 Esporta in PDF</button>
        </div>
        <div class="copertina-esci">
          <button class="btn-esci" data-action="esci">Esci</button>
          <p id="esci-hint">Il browser non consente la chiusura automatica di questa scheda: chiudila manualmente per uscire.</p>
        </div>
      </div>
    `;
  }

  function gruppiDisponibili(){
    const set = new Set();
    getRicette().forEach(r => { if(r.gruppo) set.add(r.gruppo); });
    return [...set].sort((a, b) => a.localeCompare(b, 'it'));
  }

  function renderGruppiBar(){
    const gruppi = gruppiDisponibili();
    if(gruppi.length === 0) return '';
    return `
      <div class="gruppi-bar-wrap">
        <div class="gruppi-bar-label">Gruppi di ricette collegate</div>
        <div class="gruppi-bar">
          ${gruppi.map(g => `<button class="chip-gruppo-bar" data-action="filtra-gruppo" data-gruppo="${escapeHtml(g)}">🔗 ${escapeHtml(g)}</button>`).join('')}
        </div>
      </div>
    `;
  }

  function resetFiltriBase(){
    filtri.search = ''; filtri.durata = new Set(); filtri.difficolta = new Set();
    filtri.dieta = new Set(); filtri.prep = new Set(); filtri.speciali = new Set(); filtri.gruppo = null;
  }

  function renderIndiceLanding(){
    const tutte = getRicette();
    const conteggi = {};
    CATEGORIE_ORDINE.forEach(c => { conteggi[c] = tutte.filter(r => (r.categorie || []).includes(c)).length; });
    app.innerHTML = `
      <button class="back-link" data-action="go-cover">← Copertina</button>
      <h1 class="indice-titolo-grande">Indice</h1>
      ${renderGruppiBar()}
      <button class="btn-tutte" data-action="go-tutte">📖 Tutte le ricette <span class="btn-tutte-conteggio">(${tutte.length})</span></button>
      <div class="griglia-portate">
        ${CATEGORIE_ORDINE.map(c => `
          <button class="portata-card" data-action="go-portata" data-categoria="${escapeHtml(c)}">
            <span class="emoji">${CATEGORIE_EMOJI[c] || '•'}</span>
            <span class="nome">${escapeHtml(c)}</span>
            <span class="conteggio">${conteggi[c]}</span>
          </button>
        `).join('')}
      </div>
    `;
  }

  function renderSortBar(sort){
    const statoRecenti = sort && sort.startsWith('recenti') ? sort : null;
    const statoNumero = sort && sort.startsWith('numero') ? sort : null;
    const freccia = (stato) => !stato ? '' : (stato.endsWith('-desc') ? ' ↓' : ' ↑');
    return `
      <div class="sort-bar">
        <button class="sort-btn ${statoRecenti ? 'active' : ''}" data-action="toggle-sort" data-campo="recenti">🕓 Recenti${freccia(statoRecenti)}</button>
        <button class="sort-btn ${statoNumero ? 'active' : ''}" data-action="toggle-sort" data-campo="numero"># Numero${freccia(statoNumero)}</button>
      </div>
    `;
  }

  function renderFiltriComuni(incluresiPortata){
    const tutte = getRicette();
    const durataPresenti = new Set(tutte.map(r => bucketDurata(r.tempo)));
    const portataHtml = incluresiPortata ? `
      <div class="filtro-riga filtro-riga-fissa">
        <div class="filtro-riga-titolo">PORTATA</div>
        <div class="filtro-tags">
          ${CATEGORIE_ORDINE.map(c =>
            `<button class="filtro-tag ${filtri.portata.has(c) ? 'active' : ''}" data-tipo="portata" data-valore="${escapeHtml(c)}">${CATEGORIE_EMOJI[c] || ''} ${escapeHtml(c)}</button>`
          ).join('')}
        </div>
      </div>
    ` : '';
    return `
      ${portataHtml}
      <details class="filtro-riga">
        <summary>DURATA</summary>
        <div class="filtro-tags">
          ${DURATA_BUCKETS_ORDINE.filter(b => durataPresenti.has(b)).map(b =>
            `<button class="filtro-tag ${filtri.durata.has(b) ? 'active' : ''}" data-tipo="durata" data-valore="${escapeHtml(b)}">${escapeHtml(b)}</button>`
          ).join('')}
        </div>
      </details>
      <details class="filtro-riga">
        <summary>DIFFICOLTÀ</summary>
        <div class="filtro-tags">
          ${DIFFICOLTA_OPZIONI.map(d =>
            `<button class="filtro-tag ${filtri.difficolta.has(d) ? 'active' : ''}" data-tipo="difficolta" data-valore="${escapeHtml(d)}">${escapeHtml(d)}</button>`
          ).join('')}
        </div>
      </details>
      <details class="filtro-riga">
        <summary>TIPO</summary>
        <div class="filtro-tags">
          ${DIETA_OPZIONI.map(d =>
            `<button class="filtro-tag ${filtri.dieta.has(d) ? 'active' : ''}" data-tipo="dieta" data-valore="${escapeHtml(d)}">${escapeHtml(d)}</button>`
          ).join('')}
          <button class="filtro-tag ${filtri.prep.has('Fredda') ? 'active' : ''}" data-tipo="prep" data-valore="Fredda">❄️ Fredda</button>
        </div>
      </details>
    `;
  }

  function renderFiltriSpeciali(){
    return `
      <div class="filtro-tags filtro-speciali">
        <button class="filtro-tag ${filtri.speciali.has('preferiti') ? 'active' : ''}" data-tipo="speciali" data-valore="preferiti">★ Preferiti</button>
        <button class="filtro-tag ${filtri.speciali.has('PN') ? 'active' : ''}" data-tipo="speciali" data-valore="PN">🏷️ PN</button>
        <button class="filtro-tag ${filtri.speciali.has('daProvare') ? 'active' : ''}" data-tipo="speciali" data-valore="daProvare">🧪 Da provare</button>
      </div>
    `;
  }

  function renderListaTutte(sort){
    app.innerHTML = `
      <button class="back-link" data-action="go-indice">← Indice</button>
      <h1 class="titolo-pagina">Tutte le ricette</h1>
      ${filtri.gruppo ? `<div class="chip-gruppo-attivo">Gruppo: ${escapeHtml(filtri.gruppo)} <span class="chip-x" data-action="clear-gruppo">✕</span></div>` : ''}
      ${renderSortBar(sort)}
      <input id="search-box" type="text" placeholder="Cerca per titolo, numero, autore, ingrediente..." value="${escapeHtml(filtri.search)}">
      ${renderFiltriSpeciali()}
      ${renderFiltriComuni(true)}
      <div id="risultati-indice"></div>
    `;
    document.getElementById('search-box').addEventListener('input', e => {
      filtri.search = e.target.value;
      renderRisultatiTutte(sort);
    });
    renderRisultatiTutte(sort);
  }

  function renderRisultatiTutte(sort){
    const container = document.getElementById('risultati-indice');
    const trovate = ordinaRicette(getRicette().filter(matchesFiltri), sort);
    if(trovate.length === 0){
      container.innerHTML = '<p class="no-results">Nessuna ricetta trovata.</p>';
      return;
    }
    container.innerHTML = `<p class="conteggio-risultati">${trovate.length} ricett${trovate.length === 1 ? 'a' : 'e'}</p>` +
      trovate.map(renderVoceIndice).join('');
  }

  function categorieConRicette(){
    const tutte = getRicette();
    return CATEGORIE_ORDINE.filter(c => tutte.some(r => (r.categorie || []).includes(c)));
  }

  function renderListaPortata(categoria, sort){
    const disponibili = categorieConRicette();
    const n = disponibili.length;
    const idxAttuale = disponibili.indexOf(categoria);
    const prevCat = n ? disponibili[(idxAttuale - 1 + n) % n] || disponibili[n - 1] : categoria;
    const nextCat = n ? disponibili[(idxAttuale + 1) % n] : categoria;

    app.innerHTML = `
      <button class="back-link" data-action="go-indice">← Indice</button>
      <div class="nav-portate-frecce">
        <button class="freccia-portata" data-action="go-portata-freccia" data-categoria="${escapeHtml(prevCat)}" title="Portata precedente">←</button>
        <h1 class="titolo-portata-corrente">${CATEGORIE_EMOJI[categoria] || ''} ${escapeHtml(categoria)}</h1>
        <button class="freccia-portata" data-action="go-portata-freccia" data-categoria="${escapeHtml(nextCat)}" title="Portata successiva">→</button>
      </div>
      ${renderSortBar(sort)}
      <input id="search-box" type="text" placeholder="Cerca per titolo, numero, autore, ingrediente..." value="${escapeHtml(filtri.search)}">
      ${renderFiltriSpeciali()}
      ${renderFiltriComuni(false)}
      <div id="risultati-indice"></div>
    `;
    document.getElementById('search-box').addEventListener('input', e => {
      filtri.search = e.target.value;
      renderRisultatiPortata(categoria, sort);
    });
    renderRisultatiPortata(categoria, sort);
  }

  function renderRisultatiPortata(categoria, sort){
    const container = document.getElementById('risultati-indice');
    const base = getRicette().filter(r => (r.categorie || []).includes(categoria) && matchesFiltriBase(r));
    const trovate = ordinaRicette(base, sort);
    if(trovate.length === 0){
      container.innerHTML = '<p class="no-results">Nessuna ricetta trovata in questa portata.</p>';
      return;
    }
    container.innerHTML = `<p class="conteggio-risultati">${trovate.length} ricett${trovate.length === 1 ? 'a' : 'e'}</p>` +
      trovate.map(renderVoceIndice).join('');
  }

  function renderVoceIndice(r){
    const categorie = r.categorie || [];
    return `
      <div class="voce-indice" data-action="go-ricetta" data-id="${r.id}">
        <div class="voce-indice-header">
          <div class="voce-titolo"><span class="voce-numero">#${r.numero ?? ''}</span>${escapeHtml(r.titolo)}</div>
          <button class="btn-preferito ${r.preferito ? 'attivo' : ''}" data-id="${r.id}" title="${r.preferito ? 'Rimuovi dai preferiti' : 'Aggiungi ai preferiti'}">${r.preferito ? '★' : '☆'}</button>
        </div>
        <div class="tags">
          ${categorie.map(c => `<span class="tag categoria">${escapeHtml(c)}</span>`).join('')}
          <span class="tag difficolta-${r.difficolta}">${escapeHtml(r.difficolta)}</span>
          <span class="tag tempo">⏱ ${escapeHtml(r.tempo)}</span>
          ${r.fredda ? '<span class="tag fredda">❄️ Fredda</span>' : ''}
          ${(r.dieta || []).map(d => `<span class="tag dieta">${escapeHtml(d)}</span>`).join('')}
          ${r.gruppo ? `<span class="tag gruppo" data-action="filtra-gruppo" data-gruppo="${escapeHtml(r.gruppo)}">🔗 ${escapeHtml(r.gruppo)}</span>` : ''}
          ${(r.tags || []).map(t => `<span class="tag manuale${t === 'PN' ? ' tag-pn' : ''}">${escapeHtml(t)}</span>`).join('')}
        </div>
      </div>
    `;
  }

  function ricetteCorrelate(r, tutte){
    let pool;
    if(r.gruppo){
      pool = tutte.filter(x => x.id !== r.id && x.gruppo === r.gruppo);
    } else {
      const categorie = r.categorie || [];
      pool = tutte.filter(x => x.id !== r.id && (x.categorie || []).some(c => categorie.includes(c)));
      pool.sort((a, b) => (b.numero || 0) - (a.numero || 0));
    }
    return pool.slice(0, 4);
  }

  function renderCorrelate(r, tutte){
    const correlate = ricetteCorrelate(r, tutte);
    if(correlate.length === 0) return '';
    return `
      <div class="sezione correlate-section">
        <h3 class="section-title">${r.gruppo ? 'Altre ricette di questo gruppo' : 'Potrebbe piacerti anche'}</h3>
        <div class="correlate-lista">
          ${correlate.map(c => `
            <button class="correlata-card" data-action="go-ricetta" data-id="${c.id}">
              <span class="correlata-numero">#${c.numero ?? ''}</span>
              <span class="correlata-titolo">${escapeHtml(c.titolo)}</span>
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }

  function renderRicetta(id){
    const r = getRicettaById(id);
    if(!r){
      app.innerHTML = '<p class="no-results">Ricetta non trovata. <a href="#/indice">Torna all\'indice</a></p>';
      return;
    }
    const tutte = getRicette();
    const pos = tutte.findIndex(x => x.id === id);
    const prev = tutte[pos - 1];
    const next = tutte[pos + 1];

    const persone = r.persone ? (porzioniCorrenti[id] ?? r.persone) : null;
    const fattore = r.persone ? persone / r.persone : 1;

    let macroHtml = '';
    if(r.macronutrienti){
      const m = r.macronutrienti;
      macroHtml = `
        <div class="macro-box">
          <div class="macro-title">Valori nutrizionali (per porzione)${r.macroStimato ? ' <span class="macro-badge-stimato" title="Valori stimati automaticamente in base agli ingredienti">stimato</span>' : ''}</div>
          <div class="macro-grid">
            <div>Kcal: ${escapeHtml(m.kcal)}</div>
            <div>Proteine: ${escapeHtml(m.proteine)} g</div>
            <div>Carboidrati: ${escapeHtml(m.carboidrati)} g</div>
            <div>Grassi: ${escapeHtml(m.grassi)} g</div>
          </div>
        </div>`;
    }

    let porzioniHtml = '';
    if(r.persone){
      porzioniHtml = `
        <div class="porzioni-box">
          <span class="label">Porzioni</span>
          <div class="stepper">
            <button class="stepper-btn" data-id="${r.id}" data-delta="-1">−</button>
            <span class="valore">${persone}</span>
            <button class="stepper-btn" data-id="${r.id}" data-delta="1">+</button>
          </div>
        </div>`;
    }

    const ingredientiHtml = r.ingredienti.map((ing, idx) => {
      const testo = formatIngredienteScalato(ing, fattore).trim();
      const vuoto = testo === '';
      const displayText = vuoto ? '(clicca per compilare)' : testo;
      return `
      <li>
        <span class="editable ${vuoto ? 'ingrediente-vuoto' : ''}" data-id="${r.id}" data-campo="ingrediente" data-idx="${idx}">${escapeHtml(displayText)}</span>
        <button class="ingrediente-remove" data-id="${r.id}" data-idx="${idx}" title="Rimuovi ingrediente">✕</button>
      </li>
    `;
    }).join('');

    const passiHtml = r.svolgimento.split('\n').filter(l => l.trim() !== '').map(l =>
      `<li>${escapeHtml(l.replace(/^\d+\.\s*/, ''))}</li>`
    ).join('');

    const tagsExtra = `
      ${r.fredda ? '<span class="tag fredda">❄️ Fredda</span>' : ''}
      ${(r.dieta || []).map(d => `<span class="tag dieta">${escapeHtml(d)}</span>`).join('')}
      ${r.gruppo ? `<span class="tag gruppo" data-action="filtra-gruppo" data-gruppo="${escapeHtml(r.gruppo)}">🔗 ${escapeHtml(r.gruppo)}</span>` : ''}
      ${(r.tags || []).map(t => `<span class="tag manuale${t === 'PN' ? ' tag-pn' : ''}">${escapeHtml(t)} <span class="tag-remove" data-id="${r.id}" data-tag="${escapeHtml(t)}">✕</span></span>`).join('')}
      <button class="btn-add-tag" data-id="${r.id}">+ tag</button>
    `;

    const categorieHtml = (r.categorie || []).map(c => `<span class="tag categoria">${escapeHtml(c)}</span>`).join('');

    app.innerHTML = `
      <div class="pagina-ricetta">
        <button class="back-link" data-action="torna-indietro">← Indice</button>
        <div class="ricetta-titolo-riga">
          <h1 class="editable ricetta-titolo" data-id="${r.id}" data-campo="titolo">${escapeHtml(r.titolo)}</h1>
          <button class="btn-preferito btn-preferito-grande ${r.preferito ? 'attivo' : ''}" data-id="${r.id}" title="${r.preferito ? 'Rimuovi dai preferiti' : 'Aggiungi ai preferiti'}">${r.preferito ? '★' : '☆'}</button>
        </div>
        ${r.titoloOriginale ? `<div class="titolo-originale">${escapeHtml(r.titoloOriginale)}</div>` : ''}
        <div class="autore">di @${escapeHtml(r.autore)}</div>
        <div class="meta-riga">#${r.numero ?? ''} · aggiunta il ${formattaData(r.dataAggiunta) || '—'}</div>
        <div class="tags">
          ${categorieHtml}
          <span class="tag tag-difficolta-editabile difficolta-${r.difficolta}" data-id="${r.id}" title="Clicca per cambiare difficoltà">${escapeHtml(r.difficolta)}</span>
          <span class="tag tempo editable" data-id="${r.id}" data-campo="tempo">⏱ ${escapeHtml(r.tempo)}</span>
          ${tagsExtra}
        </div>
        ${macroHtml}
        ${porzioniHtml}
        <div class="sezione">
          <h3 class="section-title">Ingredienti</h3>
          <ul class="ingredienti">${ingredientiHtml}</ul>
          <button class="btn-add-ingrediente" data-id="${r.id}">+ aggiungi ingrediente</button>
        </div>
        <div class="sezione">
          <h3 class="section-title">Preparazione</h3>
          <ol class="passi editable" data-id="${r.id}" data-campo="svolgimento" data-multiline="1">${passiHtml}</ol>
        </div>
        <div class="sezione">
          <h3 class="section-title">Note</h3>
          <div class="editable nota-box ${r.note ? '' : 'nota-vuota'}" data-id="${r.id}" data-campo="note" data-multiline="1">${r.note ? escapeHtml(r.note).replace(/\n/g, '<br>') : 'Clicca per aggiungere una nota…'}</div>
        </div>
        ${renderCorrelate(r, tutte)}
        <div class="nav-pagine">
          ${prev ? `<button class="nav-prev" data-action="nav-ricetta" data-id="${prev.id}">← ${escapeHtml(prev.titolo)}</button>` : '<span></span>'}
          ${next ? `<button class="nav-next" data-action="nav-ricetta" data-id="${next.id}">${escapeHtml(next.titolo)} →</button>` : '<span></span>'}
        </div>
      </div>
    `;
  }

  // ---------------- PULSANTE "TORNA SU" ----------------
  function aggiornaBottoneScrollTop(){
    const btn = document.getElementById('scroll-top-btn');
    if(!btn) return;
    btn.style.display = window.scrollY > 500 ? 'flex' : 'none';
  }
  window.addEventListener('scroll', aggiornaBottoneScrollTop, { passive: true });

  // ---------------- SCORCIATOIE DA TASTIERA ----------------
  document.addEventListener('keydown', e => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if(tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement?.isContentEditable) return;
    const route = parseHash();
    if(route.page !== 'ricetta') return;
    if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const r = getRicettaById(route.id);
    if(!r) return;
    const tutte = getRicette();
    const pos = tutte.findIndex(x => x.id === route.id);
    const target = e.key === 'ArrowLeft' ? tutte[pos - 1] : tutte[pos + 1];
    if(target){ e.preventDefault(); navigate('#/ricetta/' + encodeURIComponent(target.id)); }
  });

  // ---------------- EVENTI DELEGATI ----------------
  document.addEventListener('click', e => {
    let el;

    if((el = e.target.closest('[data-action="esci"]'))){
      tentaUscita();
      return;
    }
    if((el = e.target.closest('#scroll-top-btn'))){
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    if((el = e.target.closest('.btn-preferito'))){
      toggleFavorito(el.dataset.id);
      refreshView();
      return;
    }
    if((el = e.target.closest('[data-action="filtra-gruppo"]'))){
      resetFiltriBase();
      filtri.gruppo = el.dataset.gruppo;
      navigate('#/indice/tutte/' + SORT_NEUTRO);
      return;
    }
    if((el = e.target.closest('[data-action="clear-gruppo"]'))){
      filtri.gruppo = null;
      refreshView();
      return;
    }
    if((el = e.target.closest('[data-action="go-ricetta"]'))){
      navigate('#/ricetta/' + encodeURIComponent(el.dataset.id));
      return;
    }
    if((el = e.target.closest('[data-action="nav-ricetta"]'))){
      navigate('#/ricetta/' + encodeURIComponent(el.dataset.id));
      return;
    }
    if((el = e.target.closest('[data-action="torna-indietro"]'))){
      goBack('#/indice');
      return;
    }
    if((el = e.target.closest('[data-action="go-indice"]'))){
      navigate('#/indice');
      return;
    }
    if((el = e.target.closest('[data-action="go-tutte"]'))){
      resetFiltriBase();
      navigate('#/indice/tutte/' + SORT_NEUTRO);
      return;
    }
    if((el = e.target.closest('[data-action="go-portata"]'))){
      resetFiltriBase();
      navigate('#/indice/portata/' + encodeURIComponent(el.dataset.categoria) + '/' + SORT_NEUTRO);
      return;
    }
    if((el = e.target.closest('[data-action="go-portata-freccia"]'))){
      // le frecce di navigazione tra portate mantengono i filtri e l'ordinamento attivi
      const route = parseHash();
      const sort = (route.page === 'portata' && route.sort) ? route.sort : SORT_NEUTRO;
      navigate('#/indice/portata/' + encodeURIComponent(el.dataset.categoria) + '/' + encodeURIComponent(sort));
      return;
    }
    if((el = e.target.closest('[data-action="go-recenti"]'))){
      navigate('#/indice/tutte/recenti-desc');
      return;
    }
    if((el = e.target.closest('[data-action="go-cover"]'))){
      navigate('#/');
      return;
    }
    if((el = e.target.closest('[data-action="stampa-pdf"]'))){
      apriStampaRicettario();
      return;
    }
    if((el = e.target.closest('[data-action="toggle-sort"]'))){
      const campo = el.dataset.campo;
      const route = parseHash();
      const next = cicloSort(route.sort, campo);
      if(route.page === 'tutte') navigate('#/indice/tutte/' + encodeURIComponent(next));
      else if(route.page === 'portata') navigate('#/indice/portata/' + encodeURIComponent(route.categoria) + '/' + encodeURIComponent(next));
      return;
    }
    if((el = e.target.closest('.filtro-tag'))){
      const tipo = el.dataset.tipo, valore = el.dataset.valore;
      const set = filtri[tipo];
      if(set.has(valore)) set.delete(valore); else set.add(valore);
      el.classList.toggle('active');
      refreshView();
      return;
    }
    if((el = e.target.closest('.stepper-btn'))){
      cambiaPorzioni(el.dataset.id, parseInt(el.dataset.delta, 10));
      return;
    }
    if((el = e.target.closest('.tag-difficolta-editabile'))){
      cambiaDifficolta(el.dataset.id);
      return;
    }
    if((el = e.target.closest('.tag-remove'))){
      rimuoviTag(el.dataset.id, el.dataset.tag);
      return;
    }
    if((el = e.target.closest('.btn-add-tag'))){
      mostraInputTag(el);
      return;
    }
    if((el = e.target.closest('.ingrediente-remove'))){
      rimuoviIngrediente(el.dataset.id, parseInt(el.dataset.idx, 10));
      return;
    }
    if((el = e.target.closest('.btn-add-ingrediente'))){
      aggiungiIngrediente(el.dataset.id);
      return;
    }
    if((el = e.target.closest('.btn-export'))){
      esportaRicettario();
      return;
    }
    if((el = e.target.closest('.btn-dismiss-banner'))){
      dismissBanner();
      return;
    }
    if((el = e.target.closest('.editable'))){
      const id = el.dataset.id, campo = el.dataset.campo;
      const multiline = el.dataset.multiline === '1';
      const r = getRicettaById(id);
      if(campo === 'ingrediente'){
        const idx = parseInt(el.dataset.idx, 10);
        avviaModifica(el, formatIngredienteRaw(r.ingredienti[idx]), false, v => modificaIngrediente(id, idx, v));
      } else {
        avviaModifica(el, r[campo] || '', multiline, v => salvaCampo(id, campo, v));
      }
      return;
    }
  });

  window.addEventListener('hashchange', render);
  document.addEventListener('DOMContentLoaded', () => {
    caricaOverrides();
    render();
    aggiornaBanner();
  });
})();
</script>

</body>
</html>
